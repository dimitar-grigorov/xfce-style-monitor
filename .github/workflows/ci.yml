# Lint, unit tests and the extension zip on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx eslint .
      # gjs for the tests, gnome-shell for `gnome-extensions pack`
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gnome-shell
      - run: tests/run.sh
      - run: scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.shell-extension.zip
